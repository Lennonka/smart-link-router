<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>Smart Link Router</title>
   <link rel="stylesheet" href="popup.css">
</head>

<body>
   <main>
      <header class="header">
         <img class="app-icon" src="icons/icon128.png" width="32" height="32" alt="" />
         <div>
            <h1>Smart Link Router</h1>
         </div>
      </header>

      <section class="route-card" aria-label="This tab’s route">
         <div class="status" id="status" role="status" aria-live="polite" data-state="loading">Loading…</div>
         <p class="hint">Open this tab’s links in:</p>
         <label for="windowSelect">Destination window</label>
         <select id="windowSelect" disabled>
            <option value="">Loading windows…</option>
         </select>
         <div class="actions">
            <button id="clearBtn" class="clear" disabled>Clear route</button>
            <button id="setBtn" class="primary" disabled>Set route</button>
         </div>
      </section>

   </main>
   <script src="popup.js"></script>
</body>

</html>
